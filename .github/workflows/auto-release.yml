name: Auto Release

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: sentinel-auto-release
  cancel-in-progress: false

jobs:
  version:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      ref: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Check current main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          MAIN_SHA=$(gh api "repos/${REPOSITORY}/branches/main" --jq '.commit.sha')
          if [ "$MAIN_SHA" = "$COMMIT_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Select release-worthy merged PR
        id: pr
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TITLE=$(gh api "repos/${REPOSITORY}/commits/${COMMIT_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | first | .title // ""')
          case "${TITLE,,}" in
            feat!:*|*breaking*) BUMP='major' ;;
            feat:*) BUMP='minor' ;;
            fix:*|perf:*|refactor:*) BUMP='patch' ;;
            *) BUMP='none' ;;
          esac
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
      - name: Calculate and create version tag
        id: version
        if: contains(fromJSON('["major", "minor", "patch"]'), steps.pr.outputs.bump)
        env:
          BUMP: ${{ steps.pr.outputs.bump }}
        run: |
          EXISTING=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -n "$EXISTING" ]; then
            {
              echo "version=$EXISTING"
              echo "release=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          CURRENT=${CURRENT:-v0.0.0}
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT#v}"
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          git tag "$VERSION"
          git push origin "$VERSION"
          {
            echo "version=$VERSION"
            echo "release=true"
          } >> "$GITHUB_OUTPUT"
  release:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.ref }}
    secrets: inherit
