name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: sentinel-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Validate release version
        id: meta
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version"; exit 1; }
          {
            echo "version=$VERSION"
            echo "image=ghcr.io/${REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"
  build:
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Sentinel and local gateway
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p dist
          for BINARY in llm-sentinel sentinel-gateway; do
            go build -trimpath \
              -ldflags "-s -w -X github.com/szibis/claude-escalate/internal/config.Version=${VERSION}" \
              -o "dist/${BINARY}-${GOOS}-${GOARCH}" "./cmd/${BINARY}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
  github-release:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    concurrency:
      group: sentinel-release-github
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist/
      - name: Publish release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! gh release view "$VERSION" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$VERSION" --repo "$REPOSITORY" --title "$VERSION" --generate-notes --latest=false
          fi
          gh release upload "$VERSION" dist/* --repo "$REPOSITORY" --clobber
          NEWEST=$(gh api "repos/${REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$VERSION" = "$NEWEST" ]; then
            gh release edit "$VERSION" --repo "$REPOSITORY" --latest
          fi
  docker:
    needs: metadata
    runs-on: ubuntu-latest
    concurrency:
      group: sentinel-release-docker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.metadata.outputs.version }}
          tags: |
            ${{ needs.metadata.outputs.image }}:${{ needs.metadata.outputs.version }}
      - name: Promote newest semantic version to latest
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          IMAGE: ${{ needs.metadata.outputs.image }}
        run: |
          git fetch origin --tags
          NEWEST=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ "$VERSION" = "$NEWEST" ]; then
            docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${VERSION}"
          else
            echo "Published version image; a newer tag owns latest"
          fi
