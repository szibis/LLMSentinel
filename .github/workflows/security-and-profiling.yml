name: Security & Performance Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint with gosec
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./... --enable gosec --timeout 10m

      - name: Build
        run: make build

  memory-and-profiling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Memory Leak Detection
        run: go test -v -run TestMemoryLeak ./internal/test -timeout 10m

      - name: SLO Tests
        run: go test -v -run "TestSLO" ./internal/test -timeout 5m

      - name: Profiling Tests
        run: go test -v -run "TestCPU|TestHeap|TestGoroutine|TestAllocation|TestLatency" ./internal/test -timeout 10m

      - name: Generate CPU profile
        run: |
          mkdir -p profiles
          go test -run '^$' -bench=. -benchtime=100ms -cpuprofile=profiles/cpu.prof -o profiles/cpu.test ./internal/test 2>&1 | tee profiles/bench.txt

      - name: Generate Memory profile
        run: go test -run '^$' -bench=. -benchtime=100ms -memprofile=profiles/mem.prof -o profiles/mem.test ./internal/test

      - name: Security Test Suite
        run: go test -v ./internal/security/... -timeout 30s

      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profiling-results
          path: profiles/
          retention-days: 30

  fuzzing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fuzz Testing
        run: |
          for TARGET in $(go test ./internal/fuzz -list '^Fuzz' | grep '^Fuzz'); do
            go test ./internal/fuzz -run '^$' -fuzz="^${TARGET}$" -parallel=2 -fuzztime=10s -timeout=60s
          done

  stress-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Stress Tests with Race Detection
        run: go test -v -race -short -timeout 10m ./...
