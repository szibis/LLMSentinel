name: Qwen smoke harness checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -v ./internal/qwensmoke ./internal/release ./internal/taskquality ./internal/labdashboard
