version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - goprintffuncname
    - gosec
    - misspell
    - nolintlint
    - unparam
    - whitespace
  disable:
    - errcheck
    - unused
  settings:
    staticcheck:
      checks: [all, '-QF*']
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
